<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zyrko — Hush</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="apple-touch-icon" href="../favicon.png">
  <style>
    html, body { overflow: hidden; height: 100%; }

    #apparition {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 58vw;
      max-width: 560px;
      pointer-events: none;
      user-select: none;
      /* transform set entirely by JS */
    }

    #apparition img {
      width: 100%;
      display: block;
      filter: grayscale(100%) blur(18px);
      opacity: 0.05;
    }

    .hush-line {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.52rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      text-indent: 0.26em;
      color: var(--text-dim);
      opacity: 0.28;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <nav>
    <a href="../" class="nav-home">ZYRO</a>
    <a href="../about/">ABOUT</a>
    <a href="../HUSH/" class="current">HUSH</a>
    <a href="../archive/">ARCHIVE</a>
    <a href="../product/">PRODUCT</a>
  </nav>

  <div id="apparition">
    <img src="../images/Hush.PNG" alt="" draggable="false">
  </div>

  <p class="hush-line">before the threshold</p>

  <div class="cursor-dot" id="cursor-dot" aria-hidden="true"></div>

  <script>
    (() => {
      'use strict';

      const dot  = document.getElementById('cursor-dot');
      const wrap = document.getElementById('apparition');
      const img  = wrap.querySelector('img');

      let mouseX = window.innerWidth  / 2;
      let mouseY = window.innerHeight / 2;

      // lerped display values
      let smoothOp   = 0.05;
      let smoothBlur = 18;

      // drift clock — independent x/y frequencies so path never repeats exactly
      let t = 0;

      document.addEventListener('mousemove', e => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        dot.style.left = mouseX + 'px';
        dot.style.top  = mouseY + 'px';
      });

      // touch: proximity follows finger position
      const onTouch = e => {
        if (!e.touches.length) return;
        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
      };
      document.addEventListener('touchstart', onTouch, { passive: true });
      document.addEventListener('touchmove',  onTouch, { passive: true });

      function loop() {
        t += 0.0018;

        // compound sinusoidal drift — small amplitude, never still
        const dx = Math.sin(t * 0.71) * 11 + Math.sin(t * 1.37) * 5;
        const dy = Math.cos(t * 0.53) * 8  + Math.cos(t * 1.09) * 4;

        wrap.style.transform =
          `translate(calc(-50% + ${dx.toFixed(2)}px), calc(-50% + ${dy.toFixed(2)}px))`;

        // proximity to viewport center (image drifts only ±15 px, approximation is fine)
        const cx   = window.innerWidth  / 2;
        const cy   = window.innerHeight / 2;
        const dist = Math.hypot(mouseX - cx, mouseY - cy);
        const p    = Math.max(0, 1 - dist / 420);

        // never fully resolves: opacity cap 0.42, blur floor 5 px
        const targetOp   = 0.05 + p * 0.37;
        const targetBlur = 18   - p * 13;

        smoothOp   += (targetOp   - smoothOp)   * 0.038;
        smoothBlur += (targetBlur - smoothBlur)  * 0.038;

        img.style.opacity = smoothOp.toFixed(4);
        img.style.filter  = `grayscale(100%) blur(${smoothBlur.toFixed(2)}px)`;

        requestAnimationFrame(loop);
      }

      loop();
    })();
  </script>
</body>
</html>
