<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zyrko</title>
  <link rel="stylesheet" href="style.css">
  <style>html, body { overflow: hidden; height: 100%; }</style>
</head>
<body>

  <canvas id="hush-canvas"></canvas>

  <nav>
    <a href="about/">ABOUT</a>
    <a href="HUSH/">HUSH</a>
    <a href="archive/">ARCHIVE</a>
    <a href="product/">PRODUCT</a>
  </nav>

  <!-- All scene elements are fixed, anchored to viewport center via JS transform -->

  <div class="scene-el" id="zyro-field" aria-hidden="true">
    <span class="zyro-letter">Z</span><span
         class="zyro-letter">Y</span><span
         class="zyro-letter">R</span><span
         class="zyro-letter">O</span>
  </div>

  <div class="scene-el" id="void-wrap">
    <div class="void-core" id="void-core"></div>
  </div>

  <div class="scene-el" id="void-label-wrap" aria-hidden="true">
    <span class="region-label">VOID</span>
  </div>

  <div class="scene-el" id="observer-field" aria-hidden="true">
    <span class="region-label">OBSERVER</span>
    <p class="field-line">the act of mapping<br>changes the domain</p>
    <p class="field-line secondary">it cannot observe<br>its own effect</p>
  </div>

  <div class="scene-el" id="manifestation-field" aria-hidden="true">
    <span class="region-label">MANIFESTATION</span>
    <p class="field-line">a state crosses the boundary</p>
    <div class="mf-divider"></div>
    <p class="field-line secondary">irreversible</p>
  </div>

  <p class="page-marker" aria-hidden="true">in formation</p>
  <div class="cursor-dot" id="cursor-dot" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
