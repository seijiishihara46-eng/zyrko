<?xml version="1.0" encoding="UTF-8"?>
<!--
  ZYRO GLYPH — CANONICAL FONT PREP (FROZEN 2026-06-10, from v2.5)
  Target: U+E000 (Private Use Area).
  This is the fill-only conversion source. The white Orbit becomes a
  COUNTER (hole) in the black field, never a separate white object.

  FILL-ONLY CONVERSION
  1. Convert orbit-centerline-negative from stroke to path (width 9).
  2. Union the expanded Orbit where it crosses itself at the convergence (100,50).
  3. Subtract that expanded Orbit from black-infinity-field-positive.
  4. Remove all stroke and color attributes.
  5. Keep ONE black compound path with the Orbit represented as counters.
  6. Correct contour directions and validate before FontForge export.
  Do not retain a separate white object in the font.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 100"
     width="200"
     height="100"
     data-zyro-canonical="true"
     data-frozen="2026-06-10"
     data-font-target="U+E000"
     data-suggested-advance-width="200"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Zyro Glyph Canonical — Font Preparation Source</title>
  <desc id="desc">Canonical font prep: one positive black field and one negative single-stroke Orbit to be subtracted as counters.</desc>

  <g id="positive-field" data-operation="keep-positive">
    <path id="black-infinity-field-positive"
          fill="#000000"
          d="
            M 100 35
            C 84 22 67 9 45 8
            C 20 7 5 25 5 50
            C 5 76 23 93 49 93
            C 70 93 85 81 100 67
            C 115 81 131 93 153 93
            C 178 93 195 75 195 50
            C 195 25 178 7 153 7
            C 131 7 115 20 100 33
            C 99 34 99 34 100 35
            Z" />
  </g>

  <g id="negative-orbit-source" data-operation="stroke-to-path-union-then-subtract">
    <path id="orbit-centerline-negative"
          fill="none"
          stroke="#ffffff"
          stroke-width="9"
          stroke-linecap="round"
          stroke-linejoin="round"
          d="
            M 47 51
            C 52 48 55 52 54 57
            C 52 65 41 68 34 62
            C 24 54 27 39 38 33
            C 53 24 70 34 72 50
            C 74 68 59 80 43 80
            C 23 80 12 66 12 49
            C 12 30 27 16 46 16
            C 65 16 79 28 93 42
            C 96 45 98 48 100 50
            C 115 34 132 16 153 16
            C 173 16 187 31 187 50
            C 187 69 173 84 153 84
            C 133 84 116 66 100 50
            C 97 53 94 56 91 59
            C 82 68 75 75 66 79" />
  </g>
</svg>
