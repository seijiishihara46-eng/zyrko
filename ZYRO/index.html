<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zyrko — Zyro</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    html, body { overflow: hidden; height: 100%; }

    #zyro-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <nav>
    <a href="../" class="nav-home">ZYRO</a>
    <a href="../about/">ABOUT</a>
    <a href="../hush/">HUSH</a>
    <a href="../archive/">ARCHIVE</a>
    <a href="../product/">PRODUCT</a>
  </nav>

  <canvas id="zyro-canvas"></canvas>
  <div class="cursor-dot" id="cursor-dot" aria-hidden="true"></div>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('zyro-canvas');
      const ctx    = canvas.getContext('2d');
      const dot    = document.getElementById('cursor-dot');

      let mouseX = window.innerWidth  / 2;
      let mouseY = window.innerHeight / 2;

      // ── symbol definitions ──────────────────────────────────────────────────
      // bx/by : base position (fraction of viewport)
      // sc    : scale multiplier applied to BASE_SIZE
      // op    : opacity — field never becomes solid
      // rot   : base rotation (radians) — deliberate misalignment
      // fx/fy : primary drift frequency (rad/s)
      // px/py : phase offsets (rad)
      // ax/ay : drift amplitude (px)
      const defs = [
        { bx:0.10, by:0.13, sc:0.46, op:0.13, rot:-0.07, fx:0.38, fy:0.42, px:0.0,  py:1.2,  ax:11, ay:8  },
        { bx:0.31, by:0.07, sc:0.34, op:0.09, rot: 0.05, fx:0.52, fy:0.31, px:2.1,  py:0.4,  ax:8,  ay:12 },
        { bx:0.57, by:0.11, sc:0.54, op:0.16, rot:-0.03, fx:0.28, fy:0.47, px:1.0,  py:2.0,  ax:13, ay:9  },
        { bx:0.80, by:0.19, sc:0.40, op:0.12, rot: 0.08, fx:0.61, fy:0.27, px:0.7,  py:1.5,  ax:9,  ay:11 },
        { bx:0.05, by:0.45, sc:0.58, op:0.19, rot:-0.09, fx:0.34, fy:0.56, px:1.8,  py:0.9,  ax:14, ay:7  },
        { bx:0.24, by:0.39, sc:0.78, op:0.26, rot: 0.02, fx:0.44, fy:0.37, px:0.3,  py:1.7,  ax:10, ay:10 },
        { bx:0.47, by:0.35, sc:1.00, op:0.36, rot:-0.01, fx:0.26, fy:0.30, px:1.4,  py:0.6,  ax:8,  ay:8  },
        { bx:0.70, by:0.43, sc:0.70, op:0.23, rot: 0.06, fx:0.47, fy:0.41, px:2.5,  py:1.1,  ax:10, ay:13 },
        { bx:0.92, by:0.49, sc:0.42, op:0.13, rot:-0.04, fx:0.32, fy:0.58, px:0.5,  py:2.3,  ax:7,  ay:9  },
        { bx:0.16, by:0.70, sc:0.55, op:0.17, rot: 0.03, fx:0.56, fy:0.35, px:1.6,  py:0.2,  ax:11, ay:8  },
        { bx:0.39, by:0.64, sc:0.74, op:0.25, rot:-0.05, fx:0.30, fy:0.51, px:0.8,  py:1.9,  ax:9,  ay:12 },
        { bx:0.63, by:0.73, sc:0.50, op:0.16, rot: 0.07, fx:0.51, fy:0.26, px:2.2,  py:0.7,  ax:12, ay:7  },
        { bx:0.86, by:0.77, sc:0.36, op:0.10, rot:-0.03, fx:0.39, fy:0.44, px:1.1,  py:2.1,  ax:8,  ay:10 },
        { bx:0.27, by:0.88, sc:0.44, op:0.13, rot: 0.04, fx:0.54, fy:0.32, px:0.2,  py:1.4,  ax:10, ay:9  },
        { bx:0.54, by:0.91, sc:0.40, op:0.12, rot:-0.02, fx:0.35, fy:0.52, px:1.9,  py:0.5,  ax:7,  ay:11 },
        { bx:0.77, by:0.85, sc:0.48, op:0.14, rot: 0.03, fx:0.42, fy:0.38, px:0.6,  py:1.8,  ax:11, ay:8  },
      ];

      // per-symbol lerped gravitational pull offsets
      const pulls = defs.map(() => ({ x: 0, y: 0 }));

      const BASE = 78; // base render width (px)

      const img = new Image();
      img.src   = '../images/Zyro.png';

      function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      document.addEventListener('mousemove', e => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        dot.style.left = mouseX + 'px';
        dot.style.top  = mouseY + 'px';
      });

      // touch: gravitational pull follows finger
      const onTouch = e => {
        if (!e.touches.length) return;
        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
      };
      document.addEventListener('touchstart', onTouch, { passive: true });
      document.addEventListener('touchmove',  onTouch, { passive: true });

      function loop() {
        const t = Date.now() / 1000;
        const W = canvas.width;
        const H = canvas.height;

        ctx.clearRect(0, 0, W, H);

        const ar = img.naturalWidth > 0
          ? img.naturalHeight / img.naturalWidth
          : 1;

        const ready = img.complete && img.naturalWidth > 0;

        defs.forEach((d, i) => {
          const baseX = d.bx * W;
          const baseY = d.by * H;

          // compound sinusoidal drift — two overlapping waves per axis
          // different scale factor (1.61, 1.38) keeps paths aperiodic
          const dx = Math.sin(t * d.fx + d.px) * d.ax
                   + Math.sin(t * d.fx * 1.61 + d.px * 0.77) * d.ax * 0.30;
          const dy = Math.cos(t * d.fy + d.py) * d.ay
                   + Math.cos(t * d.fy * 1.38 + d.py * 0.64) * d.ay * 0.24;

          // gravitational pull toward cursor — capped so symbols don't migrate far
          const rawPX = (mouseX - baseX) * 0.026;
          const rawPY = (mouseY - baseY) * 0.026;
          const mag   = Math.hypot(rawPX, rawPY);
          const cap   = 20;
          const f     = mag > cap ? cap / mag : 1;
          pulls[i].x += (rawPX * f - pulls[i].x) * 0.014;
          pulls[i].y += (rawPY * f - pulls[i].y) * 0.014;

          const x = baseX + dx + pulls[i].x;
          const y = baseY + dy + pulls[i].y;

          const w = BASE * d.sc;
          const h = w * ar;

          ctx.save();
          ctx.globalAlpha = d.op;
          ctx.filter      = 'grayscale(1)';
          ctx.translate(x, y);
          ctx.rotate(d.rot + Math.sin(t * d.fx * 0.5 + d.px) * 0.012); // micro rotation drift
          if (ready) ctx.drawImage(img, -w / 2, -h / 2, w, h);
          ctx.restore();
        });

        requestAnimationFrame(loop);
      }

      img.onload = loop;
      if (img.complete) loop();
    })();
  </script>
</body>
</html>
