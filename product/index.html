<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zyrko — Product</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="apple-touch-icon" href="../favicon.png">
  <style>
    .product-table {
      width: 100%;
      border-collapse: collapse;
      margin: 0;
    }
    .product-table th {
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-dim);
      font-weight: 300;
      text-align: left;
      padding-bottom: 1rem;
      text-indent: 0.2em;
    }
    .product-table th:not(:first-child) {
      padding-left: 2rem;
    }
    .product-table td {
      font-size: 0.76rem;
      color: var(--text-dim);
      padding-bottom: 0;
      vertical-align: top;
      letter-spacing: 0.03em;
    }
    .product-table td:not(:first-child) {
      padding-left: 2rem;
    }
    .product-rule {
      width: 100%;
      height: 1px;
      background: var(--secondary);
      border: none;
      margin-bottom: 1.4rem;
    }
  </style>
</head>
<body class="page">

  <nav>
    <a href="../" class="nav-home">ZYRO</a>
    <a href="../about/">ABOUT</a>
    <a href="../HUSH/">HUSH</a>
    <a href="../archive/">ARCHIVE</a>
    <a href="../product/" class="current">PRODUCT</a>
  </nav>

  <div class="page-wrap">

    <p class="page-heading">Product</p>
    <p class="page-line dim">what ships.</p>

    <hr class="page-rule">

    <table class="product-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Description</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="3"><hr class="product-rule"></td>
        </tr>
        <tr>
          <td>—</td>
          <td>—</td>
          <td>—</td>
        </tr>
      </tbody>
    </table>

    <hr class="page-rule" style="margin-top:2.5rem;">

    <p class="page-line faint">nothing has crossed the boundary yet.</p>

  </div>

  <div class="cursor-dot" id="cursor-dot" aria-hidden="true"></div>
  <script src="../page.js"></script>
</body>
</html>
