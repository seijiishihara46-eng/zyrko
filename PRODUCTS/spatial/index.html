<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Zyrko — Spatial</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #050505;
      --secondary:   #1a1a1a;
      --text-dim:    #272727;
      --text-mid:    #585858;
      --text-surface:#9a9a9a;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: -apple-system, 'SF Mono', 'Menlo', monospace;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #canvas-three {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
    }

    #video { display: none; }

    /* ── node labels ── */
    .node-label {
      position: fixed;
      pointer-events: none;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: lowercase;
      color: var(--text-dim);
      white-space: nowrap;
      transform: translate(-50%, -200%);
      transition: color 0.3s;
    }
    .node-label.grabbed { color: var(--text-mid); }

    /* ── HUD ── */
    #status {
      position: fixed; top: 16px; left: 16px;
      font-size: 9px; letter-spacing: 0.16em;
      color: var(--text-dim);
      text-transform: lowercase;
    }

    #toast {
      position: fixed; top: 16px; right: 16px;
      font-size: 9px; letter-spacing: 0.14em;
      color: var(--text-mid);
      opacity: 0;
      transition: opacity 0.3s;
    }

    /* ── controls ── */
    #controls {
      position: fixed; bottom: 18px; left: 16px;
      display: flex; gap: 6px; align-items: center;
    }

    button {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--secondary);
      padding: 5px 11px;
      font-family: inherit;
      font-size: 9px;
      letter-spacing: 0.1em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    button:hover { color: var(--text-mid); border-color: #2e2e2e; }
    button:active { color: var(--text-surface); }

    /* ── debug ── */
    #debug-canvas {
      position: fixed; bottom: 60px; right: 16px;
      width: 160px; height: 120px;
      opacity: 0.5;
      border: 1px solid var(--secondary);
      display: none;
    }

    #btn-debug {
      position: fixed; bottom: 18px; right: 16px;
      padding: 5px 8px;
    }

    /* ── pinch indicator ── */
    #pinch-ring {
      position: fixed;
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1px solid var(--text-dim);
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s, transform 0.1s;
    }
    #pinch-ring.active {
      opacity: 1;
      border-color: var(--text-mid);
      transform: translate(-50%, -50%) scale(0.6);
    }
  </style>
</head>
<body>

<canvas id="canvas-three"></canvas>
<video id="video" playsinline autoplay muted></video>
<canvas id="debug-canvas"></canvas>
<div id="labels"></div>
<div id="status">—</div>
<div id="toast"></div>
<div id="pinch-ring"></div>

<div id="controls">
  <button id="btn-camera">camera</button>
  <button id="btn-add">+ node</button>
  <button id="btn-export">export</button>
  <button id="btn-reset">reset</button>
</div>
<button id="btn-debug">dbg</button>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<!-- MediaPipe Hands -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
'use strict';

// ─── renderer ───────────────────────────────────────────────────────────────

const canvas = document.getElementById('canvas-three');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x050505);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050505, 0.016);

const cam = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 200);
cam.position.set(0, 0, 24);

scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const sun = new THREE.DirectionalLight(0xffffff, 0.55);
sun.position.set(4, 8, 10);
scene.add(sun);

// ─── node definitions ────────────────────────────────────────────────────────

const NODE_DEFS = [
  { id: 'hush',         label: 'Hush',         pos: [ 0.0,  3.2,  0.5], color: 0x888888 },
  { id: 'ambivalence',  label: 'Ambivalence',   pos: [-5.0, -1.0,  2.0], color: 0x6b6b99 },
  { id: 'synergy',      label: 'Synergy',       pos: [ 4.5, -2.5,  0.0], color: 0x886644 },
  { id: 'convergence',  label: 'Convergence',   pos: [ 3.0,  2.0, -2.5], color: 0x557755 },
  { id: 'observation',  label: 'Observation',   pos: [-3.0,  1.5, -3.0], color: 0x776655 },
];

// phase topology connections
const EDGE_PAIRS = [
  ['hush',        'ambivalence'],
  ['ambivalence', 'synergy'],
  ['synergy',     'convergence'],
  ['convergence', 'observation'],
  ['observation', 'hush'],
  ['ambivalence', 'convergence'],
];

// ─── node state ──────────────────────────────────────────────────────────────

const nodes = {};   // id → { mesh, labelEl, displayLabel, color }
let edgeLines = null;

const sphereGeo = new THREE.SphereGeometry(0.32, 24, 16);

function makeMat(color) {
  return new THREE.MeshLambertMaterial({
    color,
    transparent: true,
    opacity: 0.88,
  });
}

function createNode(def) {
  const mesh = new THREE.Mesh(sphereGeo, makeMat(def.color));
  mesh.position.fromArray(def.pos);
  scene.add(mesh);

  const el = document.createElement('div');
  el.className = 'node-label';
  el.textContent = def.label.toLowerCase();
  document.getElementById('labels').appendChild(el);

  nodes[def.id] = {
    mesh,
    labelEl: el,
    displayLabel: def.label,
    color: def.color,
    id: def.id,
  };
}

NODE_DEFS.forEach(createNode);

// ─── edges ───────────────────────────────────────────────────────────────────

const edgeMat = new THREE.LineBasicMaterial({
  color: 0x1c1c1c,
  transparent: true,
  opacity: 0.8,
});

function rebuildEdges() {
  if (edgeLines) { scene.remove(edgeLines); edgeLines.geometry.dispose(); }
  const pts = [];
  EDGE_PAIRS.forEach(([a, b]) => {
    if (nodes[a] && nodes[b]) {
      pts.push(nodes[a].mesh.position.clone());
      pts.push(nodes[b].mesh.position.clone());
    }
  });
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  edgeLines = new THREE.LineSegments(geo, edgeMat);
  scene.add(edgeLines);
}
rebuildEdges();

// ─── cursor ──────────────────────────────────────────────────────────────────

const cursorGeo = new THREE.SphereGeometry(0.12, 10, 7);
const cursorMat = new THREE.MeshBasicMaterial({ color: 0x2a2a2a });
const cursorMesh = new THREE.Mesh(cursorGeo, cursorMat);
cursorMesh.visible = false;
scene.add(cursorMesh);

const cursorWorld = new THREE.Vector3();

// ─── hand → world mapping ────────────────────────────────────────────────────

// MediaPipe normalized [0,1] → Three.js world space
// Front (selfie) camera: flip X
const SPREAD_X = 18;
const SPREAD_Y = 13;
const DEPTH_SCALE = 5;

function landmarkToWorld(lm) {
  return new THREE.Vector3(
    (0.5 - lm.x) * SPREAD_X,  // flip x for selfie
    (0.5 - lm.y) * SPREAD_Y,
    -lm.z * DEPTH_SCALE
  );
}

// ─── interaction ─────────────────────────────────────────────────────────────

let grabbedId = null;
let isPinching = false;
let handVisible = false;
const pinchRing = document.getElementById('pinch-ring');

function onPinchStart() {
  let nearest = null;
  let nearestDist = Infinity;
  Object.values(nodes).forEach(node => {
    const d = cursorWorld.distanceTo(node.mesh.position);
    if (d < nearestDist) { nearestDist = d; nearest = node; }
  });
  if (nearest && nearestDist < 2.8) {
    grabbedId = nearest.id;
    nearest.labelEl.classList.add('grabbed');
  }
}

function onPinchEnd() {
  if (grabbedId && nodes[grabbedId]) {
    nodes[grabbedId].labelEl.classList.remove('grabbed');
  }
  grabbedId = null;
}

// ─── MediaPipe ───────────────────────────────────────────────────────────────

const video = document.getElementById('video');
const debugCanvas = document.getElementById('debug-canvas');
const debugCtx = debugCanvas.getContext('2d');
let mpHands = null;
let cameraActive = false;

function onResults(results) {
  handVisible = !!(results.multiHandLandmarks && results.multiHandLandmarks.length > 0);

  // debug overlay
  if (debugCanvas.style.display !== 'none') {
    debugCtx.clearRect(0, 0, debugCanvas.width, debugCanvas.height);
    if (handVisible) {
      const lms = results.multiHandLandmarks[0];
      const W = debugCanvas.width, H = debugCanvas.height;
      lms.forEach((lm, i) => {
        debugCtx.beginPath();
        debugCtx.arc(lm.x * W, lm.y * H, i === 4 || i === 8 ? 4 : 2, 0, Math.PI * 2);
        debugCtx.fillStyle = i === 8 ? '#668' : i === 4 ? '#866' : '#333';
        debugCtx.fill();
      });
    }
  }

  if (!handVisible) {
    cursorMesh.visible = false;
    if (grabbedId) onPinchEnd();
    isPinching = false;
    pinchRing.classList.remove('active');
    setStatus('no hand');
    return;
  }

  const lms = results.multiHandLandmarks[0];
  const indexTip = lms[8];
  const thumbTip = lms[4];

  // cursor
  const target = landmarkToWorld(indexTip);
  cursorWorld.lerp(target, 0.38);
  cursorMesh.position.copy(cursorWorld);
  cursorMesh.visible = true;

  // update pinch ring screen position
  const proj = cursorWorld.clone().project(cam);
  const sx = (proj.x * 0.5 + 0.5) * innerWidth;
  const sy = (-proj.y * 0.5 + 0.5) * innerHeight;
  pinchRing.style.left = sx + 'px';
  pinchRing.style.top = sy + 'px';

  // pinch detection
  const dx = thumbTip.x - indexTip.x;
  const dy = thumbTip.y - indexTip.y;
  const pinchDist = Math.sqrt(dx * dx + dy * dy);
  const wasPinching = isPinching;
  isPinching = pinchDist < 0.065;

  if (isPinching !== wasPinching) {
    if (isPinching) { onPinchStart(); pinchRing.classList.add('active'); }
    else { onPinchEnd(); pinchRing.classList.remove('active'); }
  }

  if (isPinching && grabbedId && nodes[grabbedId]) {
    nodes[grabbedId].mesh.position.lerp(cursorWorld, 0.42);
    rebuildEdges();
  }

  if (isPinching && grabbedId) setStatus('holding ' + grabbedId);
  else if (isPinching) setStatus('pinching');
  else setStatus('tracking');
}

async function startCamera() {
  if (cameraActive) return;
  setStatus('requesting camera');

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
    });
    video.srcObject = stream;
    await video.play();
  } catch (err) {
    setStatus('camera denied');
    return;
  }

  mpHands = new Hands({
    locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });
  mpHands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.62,
    minTrackingConfidence: 0.52,
  });
  mpHands.onResults(onResults);

  cameraActive = true;
  setStatus('loading model');
  document.getElementById('btn-camera').textContent = 'camera ✓';

  const frame = async () => {
    if (!cameraActive) return;
    if (video.readyState >= 2) {
      try { await mpHands.send({ image: video }); } catch (_) {}
    }
    requestAnimationFrame(frame);
  };
  frame();
}

// ─── UI ──────────────────────────────────────────────────────────────────────

function setStatus(text) {
  document.getElementById('status').textContent = text;
}

function showToast(msg, ms = 1600) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, ms);
}

document.getElementById('btn-camera').addEventListener('click', startCamera);

document.getElementById('btn-add').addEventListener('click', () => {
  const raw = prompt('node label:');
  if (!raw || !raw.trim()) return;
  const label = raw.trim();
  const id = label.toLowerCase().replace(/\s+/g, '-') + '-' + Date.now().toString(36);
  const hue = Math.random();
  const color = new THREE.Color().setHSL(hue, 0.14, 0.33).getHex();
  const pos = [
    (Math.random() - 0.5) * 8,
    (Math.random() - 0.5) * 6,
    (Math.random() - 0.5) * 4,
  ];
  createNode({ id, label, pos, color });
  rebuildEdges();
  showToast('+ ' + label);
});

document.getElementById('btn-export').addEventListener('click', exportJSON);

document.getElementById('btn-reset').addEventListener('click', () => {
  NODE_DEFS.forEach(def => {
    if (nodes[def.id]) nodes[def.id].mesh.position.fromArray(def.pos);
  });
  rebuildEdges();
  showToast('reset');
});

document.getElementById('btn-debug').addEventListener('click', () => {
  debugCanvas.style.display = debugCanvas.style.display === 'none' ? 'block' : 'none';
});

function exportJSON() {
  const data = {
    nodes: Object.values(nodes).map(n => ({
      id: n.id,
      label: n.displayLabel,
      position: {
        x: +n.mesh.position.x.toFixed(3),
        y: +n.mesh.position.y.toFixed(3),
        z: +n.mesh.position.z.toFixed(3),
      }
    })),
    edges: EDGE_PAIRS,
    timestamp: new Date().toISOString(),
  };
  const json = JSON.stringify(data, null, 2);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(json).then(() => showToast('copied to clipboard'));
  } else {
    const ta = document.createElement('textarea');
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    ta.value = json;
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('copied');
  }
}

// ─── keyboard ────────────────────────────────────────────────────────────────

document.addEventListener('keydown', e => {
  if (document.activeElement.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'n') document.getElementById('btn-add').click();
  if (k === 'e') exportJSON();
  if (k === 'r') document.getElementById('btn-reset').click();
  if (k === 'd') document.getElementById('btn-debug').click();
  if (k === 'c' && !cameraActive) startCamera();
});

// ─── label projection ────────────────────────────────────────────────────────

const _projV = new THREE.Vector3();

function updateLabels() {
  Object.values(nodes).forEach(({ mesh, labelEl }) => {
    _projV.copy(mesh.position).project(cam);
    const x = (_projV.x * 0.5 + 0.5) * innerWidth;
    const y = (-_projV.y * 0.5 + 0.5) * innerHeight;
    labelEl.style.left = x + 'px';
    labelEl.style.top = y + 'px';
    labelEl.style.visibility = _projV.z < 1.0 ? 'visible' : 'hidden';
  });
}

// ─── render loop ─────────────────────────────────────────────────────────────

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // slow drift when idle
  if (!handVisible) {
    scene.rotation.y = Math.sin(t * 0.09) * 0.12;
    scene.rotation.x = Math.cos(t * 0.06) * 0.04;
  } else {
    scene.rotation.y *= 0.94;
    scene.rotation.x *= 0.94;
  }

  // subtle pulse on each node
  Object.values(nodes).forEach((node, i) => {
    if (node.id !== grabbedId) {
      const pulse = 1 + Math.sin(t * 0.7 + i * 1.3) * 0.03;
      node.mesh.scale.setScalar(pulse);
    } else {
      node.mesh.scale.setScalar(1.08);
    }
  });

  updateLabels();
  renderer.render(scene, cam);
}

// ─── resize ──────────────────────────────────────────────────────────────────

function onResize() {
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
window.addEventListener('resize', onResize);
onResize();

setStatus('tap camera to begin');
animate();
</script>
</body>
</html>
